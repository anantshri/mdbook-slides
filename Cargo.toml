[package]
name = "mdbook-slides"
version = "0.3.0"
edition = "2021"
description = "An mdbook preprocessor that renders slide presentations from markdown"
license = "GPL-3.0"
repository = "https://github.com/anantshri/mdbook-slides"
keywords = ["mdbook", "slides", "presentation", "preprocessor"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
include = [
    "src/**/*",
    "assets/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[[bin]]
name = "mdbook-slides"
path = "src/main.rs"

[dependencies]
mdbook-preprocessor = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
toml_edit = "0.23"
log = "0.4"
env_logger = "0.11"
