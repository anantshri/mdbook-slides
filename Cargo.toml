[package]
name = "mdbook-slides"
version = "0.1.0"
edition = "2021"
description = "An mdbook preprocessor that renders slide presentations from markdown"
license = "GPL-3.0"
repository = "https://github.com/anantshri/mdbook-slides"
keywords = ["mdbook", "slides", "presentation", "preprocessor"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[[bin]]
name = "mdbook-slides"
path = "src/main.rs"

[dependencies]
mdbook = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
toml_edit = "0.22"
log = "0.4"
env_logger = "0.11"
